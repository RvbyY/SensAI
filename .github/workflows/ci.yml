name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  mirror-to-epitech:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'RvbyY/SensAI'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          EPITECH_SSH_KEY: ${{ secrets.EPITECH_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          key="$EPITECH_SSH_KEY"
          key="${key//\\n/$'\n'}"
          printf '%s\n' "$key" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Epitech
        run: |
          git remote add epitech git@github.com:EpitechPGE3-2026/G-AIA-500-STG-5-1-sensai-4.git
          git push --mirror epitech